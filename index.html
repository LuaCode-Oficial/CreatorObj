<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashHost - Premium</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --sidebar-w: 250px;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        /* --- MENU LATERAL (SIDEBAR) --- */
        .sidebar {
            position: fixed;
            left: calc(-1 * var(--sidebar-w));
            top: 0;
            width: var(--sidebar-w);
            height: 100%;
            background: var(--card);
            z-index: 2000;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar.active { left: 0; }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #94a3b8;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1900;
        }

        /* --- CONTEÚDO --- */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: opacity 0.3s;
        }

        .upload-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 2px dashed #334155;
            max-width: 400px; width: 100%;
        }

        /* --- GALERIA "MINHAS" --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 60px;
        }

        .gallery-item {
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            border: 1px solid #334155;
            transition: 0.2s;
        }

        .gallery-item:hover { transform: scale(1.03); border-color: var(--primary); }

        .gallery-item img, .gallery-item video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* --- BOTÕES E MODAIS --- */
        .btn-main {
            background: var(--primary);
            color: white; border: none;
            padding: 14px 28px; border-radius: 12px;
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            margin: 20px auto 0;
        }

        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 3000;
        }

        .modal-content {
            background: var(--card); padding: 30px; border-radius: 20px;
            max-width: 350px; text-align: center;
        }

        .fullscreen-view {
            display: none; position: fixed; top:0; left:0; width: 100%; height: 100%;
            background: black; z-index: 4000;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <button class="menu-toggle" onclick="toggleSidebar()">
        <i data-lucide="menu"></i>
    </button>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <nav class="sidebar" id="sidebar">
        <h2 style="margin-bottom: 30px; color: var(--primary)">FlashHost</h2>
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <i data-lucide="home"></i> Início
        </div>
        <div class="nav-item" id="nav-my" onclick="switchTab('my')">
            <i data-lucide="folder-heart"></i> Minhas
        </div>
    </nav>

    <div class="container" id="mainApp">
        
        <div id="tab-home" class="tab-content">
            <div id="step1" class="upload-card">
                <i data-lucide="cloud-upload" stroke-width="1.5" size="64" style="color: var(--primary)"></i>
                <h2>Hospedar Arquivo</h2>
                <p style="color: #94a3b8">Selecione uma imagem ou vídeo</p>
                <input type="file" id="fileInput" accept="image/*,video/*" class="hidden">
                <button class="btn-main" onclick="document.getElementById('fileInput').click()">
                    <i data-lucide="folder-open"></i> Selecionar
                </button>
            </div>

            <div id="step3" class="result-screen hidden">
                <div id="mediaPreviewContainer" style="max-width: 400px; margin: 0 auto"></div>
                <div style="background: #0f172a; padding: 15px; border-radius: 12px; display: flex; gap: 10px; margin-top: 20px">
                    <input type="text" id="generatedLink" readonly style="background: transparent; border: none; color: #94a3b8; flex: 1">
                    <button onclick="copyLink()" style="background: none; border: none; color: var(--primary); cursor: pointer">
                        <i data-lucide="copy"></i>
                    </button>
                </div>
                <button class="btn-main" style="background: #334155" onclick="switchTab('home')">Subir outro</button>
            </div>
        </div>

        <div id="tab-my" class="tab-content hidden">
            <h2 style="text-align: center">Meus Arquivos</h2>
            <div class="gallery-grid" id="galleryGrid">
                </div>
        </div>

    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <i data-lucide="help-circle" size="48" style="color: var(--primary)"></i>
            <h3>Deseja hospedar?</h3>
            <p id="fileNameDisplay" style="font-size: 14px; color: #94a3b8; margin: 10px 0"></p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px">
                <button id="uploadBtn" class="btn-main" style="margin:0" onclick="confirmUpload()">Hospedar</button>
                <button class="btn-main" style="background: #ef4444; margin:0" onclick="closeModal()">Sair</button>
            </div>
        </div>
    </div>

    <div id="fullscreenView" class="fullscreen-view">
        <div id="fullContent" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>
        <button onclick="closeFullscreen()" style="position:fixed; top:20px; right:20px; background:rgba(255,255,255,0.2); border:none; color:white; padding:15px; border-radius:50%; cursor:pointer;">
            <i data-lucide="x"></i>
        </button>
    </div>

    <script>
        lucide.createIcons();

        // Configurações do Supabase
        const supabaseUrl = 'https://mgrvyboskvvlcvqclufh.supabase.co';
        const supabaseKey = 'sb_publishable_HsVRJqKhYoCCVTnPTvgp9w_okpI3WE0';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedFile = null;
        let myUploads = JSON.parse(localStorage.getItem('flashhost_uploads') || '[]');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').style.display = 
                document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(tab === 'home') {
                document.getElementById('tab-home').classList.remove('hidden');
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('step1').classList.remove('hidden');
                document.getElementById('step3').classList.add('hidden');
            } else {
                document.getElementById('tab-my').classList.remove('hidden');
                document.getElementById('nav-my').classList.add('active');
                renderGallery();
            }
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileNameDisplay').innerText = file.name;
                document.getElementById('confirmModal').style.display = 'flex';
            }
        });

        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }

        // --- SISTEMA DE SALVAMENTO SUPABASE ---
        async function confirmUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true;
            btn.innerText = "Hospedando...";

            try {
                const fileId = Math.random().toString(36).substring(2, 10);
                const fileExt = selectedFile.name.split('.').pop();
                const fileName = `${fileId}.${fileExt}`;
                const mediaType = selectedFile.type.startsWith('image/') ? 'image' : 'video';

                const { data: storageData, error: storageError } = await _supabase.storage
                    .from('midias')
                    .upload(fileName, selectedFile);

                if (storageError) throw storageError;

                const { data: { publicUrl } } = _supabase.storage
                    .from('midias')
                    .getPublicUrl(fileName);

                const { error: dbError } = await _supabase
                    .from('datar')
                    .insert([{ 
                        id: fileId, 
                        media_url: publicUrl, 
                        media_type: mediaType 
                    }]);

                if (dbError) throw dbError;

                const newUpload = {
                    id: fileId,
                    data: publicUrl,
                    type: mediaType,
                    name: selectedFile.name
                };

                myUploads.push(newUpload);
                localStorage.setItem('flashhost_uploads', JSON.stringify(myUploads));
                
                closeModal();
                showResult(newUpload);

            } catch (error) {
                console.error(error);
                alert("Erro ao hospedar: " + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Hospedar";
            }
        }

        function showResult(file) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            
            const container = document.getElementById('mediaPreviewContainer');
            container.innerHTML = file.type === 'image' 
                ? `<img src="${file.data}" class="preview-img" style="width:100%; border-radius:15px">`
                : `<video src="${file.data}" class="preview-img" controls style="width:100%; border-radius:15px"></video>`;

            // --- GERAÇÃO DO LINK ÚNICO ---
            // Pega o domínio atual (ex: https://seusite.com) e adiciona o ID
            const baseUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            document.getElementById('generatedLink').value = `${baseUrl}?id=${file.id}`;
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            if(myUploads.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; opacity: 0.5">Nenhum arquivo hospedado ainda.</p>';
                return;
            }

            myUploads.forEach(file => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.onclick = () => openFullscreen(file);
                
                if(file.type === 'image') {
                    item.innerHTML = `<img src="${file.data}">`;
                } else {
                    item.innerHTML = `<video src="${file.data}"></video><div style="position:absolute; top:5px; right:5px; background: rgba(0,0,0,0.5); padding: 2px; border-radius: 4px"><i data-lucide="play" size="16"></i></div>`;
                }
                grid.appendChild(item);
            });
            lucide.createIcons();
        }

        function openFullscreen(file) {
            const content = document.getElementById('fullContent');
            content.innerHTML = file.type === 'image' || file.media_type === 'image'
                ? `<img src="${file.data || file.media_url}" style="max-width:90%; max-height:90%; object-fit: contain">`
                : `<video src="${file.data || file.media_url}" controls autoplay style="max-width:90%; max-height:90%"></video>`;
            document.getElementById('fullscreenView').style.display = 'block';
        }

        function closeFullscreen() { 
            document.getElementById('fullscreenView').style.display = 'none';
            document.getElementById('fullContent').innerHTML = ''; 
            // Ao fechar a visualização externa, limpa o ID da URL sem recarregar a página
            window.history.pushState({}, document.title, window.location.pathname);
        }
        
        function copyLink() {
            const copyText = document.getElementById("generatedLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link copiado!");
        }

        // --- SISTEMA DE VISUALIZAÇÃO POR ID ---
        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                // Busca no Supabase os dados da imagem pelo ID da URL
                const { data, error } = await _supabase
                    .from('datar')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (data && !error) {
                    openFullscreen(data);
                } else {
                    console.error("Arquivo não encontrado ou erro no banco.");
                }
            }
        }
    </script>
</body>
</html>
