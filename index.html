<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Manager Pro + IA Translator</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* =========================================
           VARIÁVEIS E ESTILOS GERAIS (DARK THEME)
        ========================================= */
        :root {
            --primary: #00f2ff;
            --danger: #ff4b5c;
            --bg: #0f172a;
            --card: #1e293b;
            --text-light: #f8fafc;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text-light); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
            margin: 0;
            padding-bottom: 100px; /* Espaço para o botão flutuante */
        }

        /* =========================================
           PAINEL DO GERENCIADOR DE APIs
        ========================================= */
        .container { 
            background: var(--card); 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        h2 { 
            text-align: center; 
            color: var(--primary); 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            font-size: 1.2rem; 
        }

        .api-creator {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        input { 
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--primary);
            padding: 15px;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        button.main-btn { 
            background: var(--primary); 
            color: #000; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }

        button.main-btn:hover { box-shadow: 0 0 20px var(--primary); opacity: 0.9; }

        #lista-mensagens { 
            width: 100%; 
            height: 300px; 
            overflow-y: auto; 
            padding-right: 5px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #lista-mensagens::-webkit-scrollbar { width: 5px; }
        #lista-mensagens::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .api-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            animation: fadeIn 0.4s ease;
        }

        .api-name { color: var(--primary); font-weight: bold; font-size: 0.8rem; margin-bottom: 5px; display: block; }
        .api-key { font-family: monospace; font-size: 0.8rem; color: #cbd5e1; word-break: break-all; display: block; padding-right: 80px; }

        .actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }

        .btn-action {
            border: 1px solid;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 0.65rem;
            cursor: pointer;
            font-weight: bold;
            background: transparent;
        }

        .copy-btn { border-color: var(--primary); color: var(--primary); }
        .copy-btn:hover { background: var(--primary); color: #000; }

        .delete-btn { border-color: var(--danger); color: var(--danger); }
        .delete-btn:hover { background: var(--danger); color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TOAST NOTIFICATION */
        #toast { 
            visibility: hidden; min-width: 200px; background: var(--primary); color: #000; 
            text-align: center; border-radius: 50px; padding: 12px; 
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            font-weight: bold; z-index: 1000; 
        }
        #toast.show { visibility: visible; animation: slideUp 0.5s; }
        @keyframes slideUp { from { bottom: 0; opacity: 0; } to { bottom: 80px; opacity: 1; } }

        /* =========================================
           ÁREA DE TRADUÇÃO INSTANTÂNEA
        ========================================= */
        .input-translator {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            box-sizing: border-box;
        }

        .input-translator h3 {
            color: var(--primary);
            margin-top: 0;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(15, 23, 42, 0.8);
            color: white;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus { border-color: var(--primary); }

        .translation-output {
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            min-height: 20px;
            font-style: italic;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .status-digitando {
            font-size: 12px;
            color: var(--primary);
            margin-top: 5px;
            display: none;
            font-weight: bold;
        }

        /* =========================================
           BOTÃO FLUTUANTE DE TRADUÇÃO (IA)
        ========================================= */
        #ia-translate-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--card);
            padding: 10px 15px;
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #ia-translate-container select {
            padding: 8px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: var(--bg);
            color: white;
            outline: none;
            font-weight: bold;
            cursor: pointer;
        }

        #btn-traduzir {
            background-color: var(--primary);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        #btn-traduzir:hover { opacity: 0.8; box-shadow: 0 0 10px var(--primary); }
        #btn-traduzir:disabled { background-color: #555; color: #999; cursor: not-allowed; box-shadow: none; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⚡ API Manager Pro</h2>
        
        <div class="api-creator">
            <input type="text" id="api_name" placeholder="Nome do Projeto (ex: App Vendas)">
            <button class="main-btn" onclick="gerarESalvarAPI()">Gerar Nova API</button>
        </div>

        <div id="lista-mensagens">
            </div>
    </div>

    <div class="input-translator">
        <h3>🌐 Tradutor Instantâneo</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; text-align: center; margin-top: 0;">O idioma alvo é definido no botão flutuante.</p>
        <textarea id="texto-entrada" placeholder="Digite ou cole um texto aqui para traduzi-lo automaticamente..."></textarea>
        <div id="status-ia" class="status-digitando">IA está traduzindo...</div>
        <div id="texto-saida" class="translation-output">A tradução aparecerá aqui...</div>
    </div>

    <div id="toast">Notificação!</div>

    <div id="ia-translate-container">
        <select id="target-lang">
            <option value="English">Inglês</option>
            <option value="Spanish">Espanhol</option>
            <option value="French">Francês</option>
            <option value="German">Alemão</option>
            <option value="Japanese">Japonês</option>
            <option value="Portuguese">Português (BR)</option>
        </select>
        <button id="btn-traduzir">Traduzir Interface</button>
    </div>

    <script>
        /* ========================================================
           CONFIGURAÇÕES DAS APIs (COLOQUE SUAS CHAVES AQUI)
        ======================================================== */
        const SUPABASE_URL = 'https://xojxdrajjkswyomfkmjr.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_YrNFzJI3pX66JfTL9GBilA_kDJQ_tbf';
        const GROQ_API_KEY = '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'; 

        // Inicializa Supabase
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ========================================================
           LÓGICA DO GERENCIADOR DE API (SUPABASE)
        ======================================================== */
        function showToast(msg, color = 'var(--primary)') {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.background = color;
            t.className = "show";
            setTimeout(() => { t.className = ""; }, 2500);
        }

        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = 'sk_live_';
            for (let i = 0; i < 24; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        function copiar(texto) {
            navigator.clipboard.writeText(texto);
            showToast("Chave Copiada!");
        }

        async function excluirAPI(id, element) {
            if(!confirm("Deseja realmente excluir esta API?")) return;

            const { error } = await supabaseClient
                .from('mensagens')
                .delete()
                .eq('id', id);

            if (error) {
                showToast("Erro ao excluir!", "var(--danger)");
            } else {
                element.remove();
                showToast("API Removida!", "var(--danger)");
            }
        }

        function adicionarNaLista(id, nome, chave) {
            const lista = document.getElementById('lista-mensagens');
            const card = document.createElement('div');
            card.className = 'api-card';
            // A classe 'no-translate' avisa o tradutor para pular a chave da API
            card.innerHTML = `
                <span class="api-name">PROJECT: ${nome.toUpperCase()}</span>
                <span class="api-key no-translate">${chave}</span>
                <div class="actions">
                    <button class="btn-action copy-btn" onclick="copiar('${chave}')">COPY</button>
                    <button class="btn-action delete-btn" onclick="excluirAPI(${id}, this.parentElement.parentElement)">DEL</button>
                </div>
            `;
            lista.prepend(card);
        }

        async function carregarAPIs() {
            const { data, error } = await supabaseClient
                .from('mensagens')
                .select('*')
                .order('created_at', { ascending: true });

            if (data) {
                document.getElementById('lista-mensagens').innerHTML = "";
                data.forEach(item => {
                    const parts = item.conteudo.split('|');
                    if (parts.length > 1) {
                        adicionarNaLista(item.id, parts[0], parts[1]);
                    }
                });
            }
        }

        async function gerarESalvarAPI() {
            const nomeInput = document.getElementById('api_name');
            const nome = nomeInput.value.trim();

            if (!nome) return alert("Dê um nome para sua API!");

            const novaChave = generateKey();
            const dadoParaSalvar = `${nome}|${novaChave}`;

            const { data, error } = await supabaseClient
                .from('mensagens') 
                .insert([{ conteudo: dadoParaSalvar }])
                .select();

            if (error) {
                showToast("Erro no Banco!", "var(--danger)");
            } else {
                adicionarNaLista(data[0].id, nome, novaChave);
                nomeInput.value = "";
                showToast("🚀 API Criada!");
            }
        }

        // Carrega os dados ao iniciar a página
        carregarAPIs();


        /* ========================================================
           LÓGICA DE TRADUÇÃO COM IA (GROQ)
        ======================================================== */
        let timeoutTraducao;

        // 1. Tradução Instantânea (Caixa de Texto)
        document.getElementById('texto-entrada').addEventListener('input', () => {
            const texto = document.getElementById('texto-entrada').value;
            const status = document.getElementById('status-ia');
            const targetLang = document.getElementById('target-lang').value;

            clearTimeout(timeoutTraducao);

            if (texto.trim() === "") {
                document.getElementById('texto-saida').innerText = "A tradução aparecerá aqui...";
                status.style.display = "none";
                return;
            }

            status.style.display = "block";

            timeoutTraducao = setTimeout(async () => {
                const traducao = await callGroqSingle(texto, targetLang);
                document.getElementById('texto-saida').innerText = traducao;
                status.style.display = "none";
            }, 1000); // 1 segundo de atraso (Debounce) para não floodar a API
        });

        // 2. Tradução da Interface Inteira
        document.getElementById('btn-traduzir').addEventListener('click', async () => {
            const btn = document.getElementById('btn-traduzir');
            const targetLang = document.getElementById('target-lang').value;
            
            btn.innerText = "Traduzindo...";
            btn.disabled = true;

            try {
                // Filtra textos da interface. IMPORTANTE: Exclui as chaves das APIs (.no-translate)
                const elements = document.querySelectorAll(`
                    body *:not(script):not(style)
                    :not(#ia-translate-container):not(#ia-translate-container *)
                    :not(.input-translator):not(.input-translator *)
                    :not(.no-translate)
                `);
                
                const textNodes = Array.from(elements).filter(el => 
                    el.children.length === 0 && el.innerText.trim() !== ""
                );
                
                const originalTexts = textNodes.map(el => el.innerText);

                if(originalTexts.length === 0) {
                    throw new Error("Nenhum texto encontrado para traduzir.");
                }

                const responseIA = await callGroqIA(originalTexts, targetLang);

                if (responseIA && responseIA.length === textNodes.length) {
                    textNodes.forEach((el, index) => {
                        el.innerText = responseIA[index];
                    });
                    showToast(`Interface traduzida para ${targetLang}!`);
                } else {
                    alert("A IA retornou um formato inesperado. Tente novamente.");
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao conectar com a API de Tradução.");
            } finally {
                btn.innerText = "Traduzir Interface";
                btn.disabled = false;
            }
        });

        // Chamada Groq: Tradução de texto único
        async function callGroqSingle(text, language) {
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: `Traduza o texto para ${language}. Retorne apenas o texto traduzido, mantendo a formatação original.` },
                            { role: "user", content: text }
                        ],
                        temperature: 0
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (e) {
                return "Erro de conexão com a IA.";
            }
        }

        // Chamada Groq: Tradução em massa (Array)
        async function callGroqIA(texts, language) {
            const prompt = `Você é um tradutor de sistemas. Traduza o seguinte array JSON de strings para o idioma: ${language}. 
            Retorne ESTRITAMENTE um array JSON válido, na exata mesma ordem, sem nenhum texto adicional.
            Array a ser traduzido: ${JSON.stringify(texts)}`;

            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "Você responde apenas com objetos JSON no formato de lista." },
                        { role: "user", content: prompt }
                    ],
                    temperature: 0,
                    response_format: { type: "json_object" }
                })
            });

            const data = await response.json();
            const content = JSON.parse(data.choices[0].message.content);
            // Extrai os valores do objeto/array JSON retornado
            return Object.values(content)[0] || content;
        }
    </script>
</body>
</html>
