<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FlashHost - Premium</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --sidebar-w: 250px;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            width: 100%; height: 100%;
        }

        /* --- MENU LATERAL --- */
        .sidebar {
            position: fixed;
            left: calc(-1 * var(--sidebar-w));
            top: 0;
            width: var(--sidebar-w);
            height: 100%;
            background: var(--card);
            z-index: 2000;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar.active { left: 0; }

        .menu-toggle {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 2100;
            background: var(--primary);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            color: #94a3b8;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.15);
            color: var(--primary);
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1900;
        }

        /* --- CONTEÚDO --- */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
        }

        .upload-card {
            background: var(--card);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            border: 2px dashed #334155;
            max-width: 400px; width: 100%;
        }

        /* --- GALERIA --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 60px;
        }

        .gallery-item {
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 1;
            cursor: pointer;
            position: relative;
            border: 1px solid #334155;
        }

        .gallery-item img, .gallery-item video {
            width: 100%; height: 100%; object-fit: cover;
        }

        /* --- BOTÕES --- */
        .btn-main {
            background: var(--primary);
            color: white; border: none;
            padding: 14px 28px; border-radius: 12px;
            font-size: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            margin: 20px auto 0;
        }

        .modal {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 3000;
        }

        .modal-content {
            background: var(--card); padding: 30px; border-radius: 20px;
            max-width: 350px; text-align: center;
        }

        /* --- TELA CHEIA IMERSIVA (PARA LINKS ÚNICOS) --- */
        .fullscreen-view {
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            background: black; 
            z-index: 5000;
            overflow: hidden;
        }

        .fullscreen-view img, .fullscreen-view video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Mantém a proporção mas ocupa a tela toda */
            background: black;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui-controls">
        <button class="menu-toggle" onclick="toggleSidebar()">
            <i data-lucide="menu"></i>
        </button>
        <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <h2 style="margin-bottom: 30px; color: var(--primary)">FlashHost</h2>
            <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
                <i data-lucide="home"></i> Início
            </div>
            <div class="nav-item" id="nav-my" onclick="switchTab('my')">
                <i data-lucide="folder-heart"></i> Minhas
            </div>
        </nav>
    </div>

    <div class="container" id="mainApp">
        <div id="tab-home" class="tab-content">
            <div id="step1" class="upload-card">
                <i data-lucide="cloud-upload" stroke-width="1.5" size="64" style="color: var(--primary)"></i>
                <h2>Hospedar Arquivo</h2>
                <input type="file" id="fileInput" accept="image/*,video/*" class="hidden">
                <button class="btn-main" onclick="document.getElementById('fileInput').click()">
                    <i data-lucide="folder-open"></i> Selecionar
                </button>
            </div>

            <div id="step3" class="result-screen hidden">
                <div id="mediaPreviewContainer" style="max-width: 400px; margin: 0 auto"></div>
                <div style="background: #0f172a; padding: 15px; border-radius: 12px; display: flex; gap: 10px; margin-top: 20px">
                    <input type="text" id="generatedLink" readonly style="background: transparent; border: none; color: #94a3b8; flex: 1">
                    <button onclick="copyLink()" style="background: none; border: none; color: var(--primary); cursor: pointer">
                        <i data-lucide="copy"></i>
                    </button>
                </div>
                <button class="btn-main" style="background: #334155" onclick="location.reload()">Subir outro</button>
            </div>
        </div>

        <div id="tab-my" class="tab-content hidden">
            <h2 style="text-align: center">Meus Arquivos</h2>
            <div class="gallery-grid" id="galleryGrid"></div>
        </div>
    </div>

    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3>Confirmar Upload?</h3>
            <p id="fileNameDisplay" style="color: #94a3b8"></p>
            <div style="display: flex; gap: 10px; margin-top: 20px">
                <button id="uploadBtn" class="btn-main" onclick="confirmUpload()">Sim</button>
                <button class="btn-main" style="background: #ef4444" onclick="closeModal()">Não</button>
            </div>
        </div>
    </div>

    <div id="fullscreenView" class="fullscreen-view">
        <div id="fullContent" style="width:100%; height:100%;"></div>
        </div>

    <script>
        lucide.createIcons();

        const supabaseUrl = 'https://mgrvyboskvvlcvqclufh.supabase.co';
        const supabaseKey = 'sb_publishable_HsVRJqKhYoCCVTnPTvgp9w_okpI3WE0';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let selectedFile = null;
        let myUploads = JSON.parse(localStorage.getItem('flashhost_uploads') || '[]');

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').style.display = 
                document.getElementById('sidebar').classList.contains('active') ? 'block' : 'none';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            if(tab === 'home') {
                document.getElementById('tab-home').classList.remove('hidden');
            } else {
                document.getElementById('tab-my').classList.remove('hidden');
                renderGallery();
            }
        }

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('fileNameDisplay').innerText = file.name;
                document.getElementById('confirmModal').style.display = 'flex';
            }
        });

        function closeModal() { document.getElementById('confirmModal').style.display = 'none'; }

        async function confirmUpload() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true; btn.innerText = "Processando...";
            try {
                const fileId = Math.random().toString(36).substring(2, 10);
                const fileName = `${fileId}.${selectedFile.name.split('.').pop()}`;
                const mediaType = selectedFile.type.startsWith('image/') ? 'image' : 'video';

                const { data: storageData, error: storageError } = await _supabase.storage
                    .from('midias').upload(fileName, selectedFile);
                if (storageError) throw storageError;

                const { data: { publicUrl } } = _supabase.storage.from('midias').getPublicUrl(fileName);

                await _supabase.from('datar').insert([{ id: fileId, media_url: publicUrl, media_type: mediaType }]);

                const newUpload = { id: fileId, data: publicUrl, type: mediaType };
                myUploads.push(newUpload);
                localStorage.setItem('flashhost_uploads', JSON.stringify(myUploads));
                
                closeModal();
                showResult(newUpload);
            } catch (error) {
                alert("Erro: " + error.message);
            }
        }

        function showResult(file) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            const finalLink = `${window.location.protocol}//${window.location.host}${window.location.pathname}?id=${file.id}`;
            document.getElementById('generatedLink').value = finalLink;
        }

        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = myUploads.map(file => `
                <div class="gallery-item" onclick="window.open('?id=${file.id}', '_blank')">
                    <${file.type === 'image' ? 'img' : 'video'} src="${file.data}">
                </div>
            `).join('');
        }

        // FUNÇÃO DE TELA CHEIA IMERSIVA
        function openImmersive(file) {
            // Esconde toda a interface do site
            document.getElementById('ui-controls').classList.add('hidden');
            document.getElementById('mainApp').classList.add('hidden');
            
            const view = document.getElementById('fullscreenView');
            const content = document.getElementById('fullContent');
            
            content.innerHTML = file.type === 'image'
                ? `<img src="${file.media_url}">`
                : `<video src="${file.media_url}" autoplay loop playsinline controls></video>`;
            
            view.style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                const { data, error } = await _supabase.from('datar').select('*').eq('id', id).single();
                if (data && !error) {
                    openImmersive(data);
                }
            }
        }

        function copyLink() {
            const copyText = document.getElementById("generatedLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link Único Copiado!");
        }
    </script>
</body>
</html>
