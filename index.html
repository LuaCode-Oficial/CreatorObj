<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #6366f1;
            --dark: #0f172a;
            --light: #f8fafc;
        }

        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--dark); color: white; overflow-x: hidden; }

        /* Animações */
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Header e Menu */
        .navbar { display: flex; justify-content: space-between; padding: 20px; background: #1e293b; }
        .menu-btn { font-size: 30px; cursor: pointer; border: none; background: none; color: white; }

        /* Painel Lateral */
        #sidePanel {
            position: fixed; left: 0; top: 0; width: 300px; height: 100%;
            background: #1e293b; z-index: 100; display: none;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
        }
        .panel-content { padding: 20px; animation: slideIn 0.3s ease-out; }
        .user-info { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        .user-img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }

        /* Telas de Login/Cadastro */
        .auth-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .auth-card { background: #1e293b; padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; }
        .hidden { display: none !important; }

        /* Grid de Jogos */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; padding: 20px; }
        .game-card { background: #334155; border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; }
        .game-card:hover { transform: scale(1.05); }
        .game-card img { width: 100%; height: 120px; object-fit: cover; }
        .game-info { padding: 10px; text-align: center; }

        /* Modal de Jogo */
        #gamePlayer { position: fixed; inset: 0; background: white; z-index: 300; display: none; }
        iframe { width: 100%; height: 100%; border: none; }

        input, textarea, button { 
            width: 100%; padding: 10px; margin: 10px 0; border-radius: 8px; border: none; 
        }
        button { background: var(--primary); color: white; font-weight: bold; cursor: pointer; }
        .close-btn { background: #ef4444; }
    </style>
</head>
<body>

    <div class="navbar">
        <button class="menu-btn" onclick="togglePanel(true)">|||</button>
        <h2>Nexus Games</h2>
        <div id="topUser"></div>
    </div>

    <div id="sidePanel">
        <div class="panel-content">
            <button class="close-btn" onclick="togglePanel(false)">X Fechar</button>
            <div class="user-info" id="panelUserInfo">
                </div>
            <button onclick="logout()">Trocar Conta</button>
            <hr>
            <button onclick="showScreen('createGame')">➕ Criar Jogo</button>
            <button onclick="showScreen('myGames')">🕹️ Meus Jogos</button>
        </div>
    </div>

    <div id="homeScreen">
        <h3 style="padding: 20px;">Populares agora</h3>
        <div class="game-grid" id="gameFeed"></div>
    </div>

    <div id="authScreen" class="auth-overlay hidden">
        <div class="auth-card" id="registerForm">
            <h3>Criar Conta</h3>
            <div id="photoPreview" style="width:100px; height:100px; border-radius:50%; background:#475569; margin: 0 auto; cursor:pointer; overflow:hidden;">
                <img id="imgAvatar" src="" class="hidden" style="width:100%; height:100%; object-fit:cover;">
                <span id="imgPlaceholder">Foto</span>
            </div>
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <input type="text" id="regName" placeholder="Nome (máx 20 char)" maxlength="20">
            <input type="email" id="regEmail" placeholder="E-mail">
            <input type="password" id="regPass" placeholder="Senha (sem emojis)">
            <button onclick="handleRegister()">Criar</button>
            <p onclick="toggleAuthMode()">Já tem conta? Login</p>
        </div>
    </div>

    <div id="gameModal" class="auth-overlay hidden">
        <div class="auth-card">
            <button onclick="closeGameModal()" style="width: 50px; float: right;">X</button>
            <img id="modalGameImg" style="width:100%; border-radius:10px;">
            <h2 id="modalGameTitle"></h2>
            <p id="modalGameDesc"></p>
            <div style="display:flex; gap:10px;">
                <button onclick="vote(1)">👍 Like</button>
                <button onclick="vote(-1)">👎 Dislike</button>
            </div>
            <p id="modalStats">🎮 0 jogando</p>
            <button onclick="playGame()" style="background:#22c55e;">JOGAR</button>
        </div>
    </div>

    <div id="gamePlayer">
        <button onclick="stopGame()" style="position:fixed; top:10px; right:10px; z-index:400;">X Sair</button>
        <iframe id="gameFrame"></iframe>
    </div>

    <script src="system.js"></script>
</body>
</html>
