<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Bola Clicker Tycoon 2.0 - TV Edition</title>
    <style>
        /* --- ESTILOS GERAIS (CSS) --- */
        :root {
            --bg-color: #1a1a2e;
            --panel-color: #16213e;
            --accent-color: #0f3460;
            --text-color: #e94560;
            --white: #ffffff;
            --green: #2ecc71;
            --gold: #f1c40f;
            --locked: rgba(0, 0, 0, 0.7);
            --tv-focus: #f1c40f; /* Cor do foco para TV */
        }

        * {
            box-sizing: border-box;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--white);
            overflow: hidden;
            display: flex;
        }

        /* ESTILO DE FOCO PARA NAVEGAÇÃO POR CONTROLE REMOTO */
        .tv-focusable.focused {
            outline: 5px solid var(--tv-focus) !important;
            outline-offset: 2px;
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--tv-focus);
            z-index: 100;
        }

        /* --- BOTÃO DE REBIRTH --- */
        #rebirth-btn-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
        }

        #rebirth-trigger {
            background: linear-gradient(45deg, #e67e22, #d35400);
            border: 2px solid #fff;
            color: white;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(230, 126, 34, 0.5);
            transition: transform 0.2s;
        }

        /* --- MODAL DE REBIRTH --- */
        #rebirth-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .modal-content {
            background: var(--panel-color);
            padding: 40px;
            border-radius: 20px;
            border: 4px solid var(--text-color);
            text-align: center;
            width: 500px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 35px; /* Maior para TV */
            cursor: pointer;
            color: var(--text-color);
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            background-color: #333;
            border-radius: 15px;
            height: 30px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff7675);
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            text-align: center;
            line-height: 30px;
            top: 0;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
        }

        #do-rebirth-btn {
            display: none;
            background: var(--green);
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            animation: pulse 1s infinite;
        }

        /* --- ÁREA DO JOGO (ESQUERDA) --- */
        #game-area {
            width: 65%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #252a40 0%, #1a1a2e 100%);
        }

        #rebirth-stats {
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 10px;
            font-weight: bold;
        }

        #score-container {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 10px var(--text-color);
            z-index: 10;
        }

        #sps-display {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
        }

        #the-ball {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff7675, #d63031);
            box-shadow: inset -20px -20px 60px rgba(0,0,0,0.5), 0 0 30px rgba(231, 76, 60, 0.6);
            cursor: pointer;
            transition: transform 0.1s ease;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #the-ball::after {
            content: '★';
            font-size: 80px;
            color: rgba(255,255,255,0.3);
        }

        .mini-gold-ball {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border-radius: 50%;
            cursor: pointer;
            z-index: 90;
            box-shadow: 0 0 15px var(--gold);
        }

        .floating-text {
            position: absolute;
            font-weight: bold;
            font-size: 1.8rem;
            color: var(--white);
            pointer-events: none;
            z-index: 999;
            text-shadow: 0 0 5px black;
            animation: floatRandom 1.5s ease-out forwards;
        }

        @keyframes floatRandom {
            0% { opacity: 1; transform: scale(0.5); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }

        /* --- PAINEL DE COMPRAS --- */
        #shop-area {
            width: 35%;
            height: 100%;
            background-color: var(--panel-color);
            border-left: 4px solid var(--accent-color);
            display: flex;
            flex-direction: column;
        }

        #shop-header {
            padding: 20px;
            background-color: var(--accent-color);
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #shop-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .shop-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .shop-icon { font-size: 2rem; margin-right: 15px; }
        .shop-info { flex: 1; }
        .shop-name { font-weight: bold; font-size: 1.1rem; display: block; }
        .shop-cost { color: var(--green); font-weight: bold; }

        .shop-item.locked { opacity: 0.5; filter: grayscale(100%); }

        #event-banner {
            position: absolute;
            top: 20px;
            background: gold;
            color: black;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
            z-index: 100;
        }

    </style>
</head>
<body>

    <div id="rebirth-btn-container">
        <button id="rebirth-trigger" class="tv-focusable" onclick="openRebirthModal()">⚡ RENASCIMENTO</button>
    </div>

    <div id="rebirth-modal">
        <div class="modal-content">
            <span class="close-btn tv-focusable" onclick="closeRebirthModal()">×</span>
            <h2>SALA DE RENASCIMENTO</h2>
            <div class="progress-container">
                <div class="progress-bar" id="rebirth-progress-bar"></div>
                <div class="progress-text" id="rebirth-progress-text">0 / 0</div>
            </div>
            <button id="do-rebirth-btn" class="tv-focusable" onclick="executeRebirth()">RENASCER AGORA!</button>
        </div>
    </div>

    <div id="game-area">
        <div id="event-banner">EVENTO ATIVO!</div>
        <div id="rebirth-stats">Renascimentos: <span id="rebirth-count">0</span> (x<span id="rebirth-mult">1</span>)</div>
        <div id="score-container">$<span id="score">0</span></div>
        <div id="sps-display">por segundo: <span id="sps">0</span></div>
        <div id="the-ball" class="tv-focusable" onclick="clickBall()"></div>
    </div>

    <div id="shop-area">
        <div id="shop-header">Mercado Negro da Bola</div>
        <div id="shop-list"></div>
    </div>

    <script>
        /* --- LÓGICA DO JOGO --- */
        let gameData = { score: 0, clickValue: 1, autoClick: 0, multiplier: 1, rebirths: 0, rebirthMultiplier: 1 };
        let currentRebirthCost = 1000000;
        let eventMultiplier = 1;
        let eventActive = false;

        const scoreEl = document.getElementById('score');
        const spsEl = document.getElementById('sps');
        const ball = document.getElementById('the-ball');
        const shopList = document.getElementById('shop-list');
        const rebirthModal = document.getElementById('rebirth-modal');

        // --- SISTEMA DE SELEÇÃO TV ---
        let focusIndex = 0;
        let currentSection = 'game'; // 'game', 'shop', 'modal'

        function updateTVFocus() {
            document.querySelectorAll('.tv-focusable').forEach(el => el.classList.remove('focused'));
            
            let focusables;
            if (rebirthModal.style.display === 'flex') {
                focusables = rebirthModal.querySelectorAll('.tv-focusable');
            } else {
                focusables = document.querySelectorAll('#game-area .tv-focusable, #shop-area .tv-focusable, #rebirth-btn-container .tv-focusable');
            }

            if (focusIndex >= focusables.length) focusIndex = focusables.length - 1;
            if (focusIndex < 0) focusIndex = 0;

            const target = focusables[focusIndex];
            if (target) {
                target.classList.add('focused');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        window.addEventListener('keydown', (e) => {
            let focusables;
            if (rebirthModal.style.display === 'flex') {
                focusables = rebirthModal.querySelectorAll('.tv-focusable');
            } else {
                focusables = document.querySelectorAll('#game-area .tv-focusable, #shop-area .tv-focusable, #rebirth-btn-container .tv-focusable');
            }

            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                focusIndex = (focusIndex + 1) % focusables.length;
                updateTVFocus();
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                focusIndex = (focusIndex - 1 + focusables.length) % focusables.length;
                updateTVFocus();
            } else if (e.key === 'Enter' || e.key === ' ') {
                const target = focusables[focusIndex];
                if (target) target.click();
            }
        });

        // --- FUNÇÕES DO JOGO ---
        function formatNumber(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + " T";
            if (num >= 1e9) return (num / 1e9).toFixed(2) + " B";
            if (num >= 1e6) return (num / 1e6).toFixed(2) + " M";
            return Math.floor(num).toLocaleString('pt-BR');
        }

        let upgrades = [
            { name: "Dedo Extra", baseCost: 15, bonus: 1, type: "auto", icon: "👆", count: 0, currentCost: 15 },
            { name: "Mouse Gamer", baseCost: 100, bonus: 5, type: "auto", icon: "🖱️", count: 0, currentCost: 100 },
            { name: "Treinador", baseCost: 1500, bonus: 50, type: "auto", icon: "📣", count: 0, currentCost: 1500 },
            { name: "Estádio Local", baseCost: 20000, bonus: 500, type: "auto", icon: "🏟️", count: 0, currentCost: 20000 },
            { name: "Robô Jogador", baseCost: 2000000, bonus: 15000, type: "auto", icon: "🤖", count: 0, currentCost: 2000000 }
        ];

        function initShop() {
            shopList.innerHTML = "";
            upgrades.forEach((item, index) => {
                const btn = document.createElement('div');
                btn.className = 'shop-item locked tv-focusable';
                btn.id = `item-${index}`;
                btn.onclick = () => buyUpgrade(index);
                btn.innerHTML = `
                    <div class="shop-icon">${item.icon}</div>
                    <div class="shop-info">
                        <span class="shop-name">${item.name}</span>
                        <span class="shop-cost">$ ${formatNumber(item.currentCost)}</span>
                    </div>
                    <div>x<span id="count-${index}">0</span></div>
                `;
                shopList.appendChild(btn);
            });
            updateTVFocus();
        }

        function clickBall() {
            let val = gameData.clickValue * gameData.multiplier * eventMultiplier * gameData.rebirthMultiplier;
            gameData.score += val;
            spawnFloatingText("+" + formatNumber(val), ball.offsetLeft + 100, ball.offsetTop + 100);
            updateUI();
        }

        function buyUpgrade(index) {
            const item = upgrades[index];
            if (gameData.score >= item.currentCost) {
                gameData.score -= item.currentCost;
                if (item.type === 'click') gameData.clickValue += item.bonus;
                else gameData.autoClick += item.bonus;
                item.count++;
                item.currentCost = Math.ceil(item.currentCost * 1.5);
                updateUI();
            }
        }

        function updateUI() {
            scoreEl.innerText = formatNumber(gameData.score);
            spsEl.innerText = formatNumber(gameData.autoClick * gameData.rebirthMultiplier);
            document.getElementById('rebirth-count').innerText = gameData.rebirths;
            document.getElementById('rebirth-mult').innerText = formatNumber(gameData.rebirthMultiplier);
            
            upgrades.forEach((item, index) => {
                const btn = document.getElementById(`item-${index}`);
                btn.querySelector('.shop-cost').innerText = "$ " + formatNumber(item.currentCost);
                document.getElementById(`count-${index}`).innerText = item.count;
                btn.classList.toggle('locked', gameData.score < item.currentCost);
            });

            if(rebirthModal.style.display === 'flex') updateRebirthUI();
        }

        function openRebirthModal() { 
            rebirthModal.style.display = 'flex'; 
            focusIndex = 0;
            updateTVFocus();
        }
        function closeRebirthModal() { 
            rebirthModal.style.display = 'none'; 
            focusIndex = 0;
            updateTVFocus();
        }

        function updateRebirthUI() {
            const percent = Math.min(100, (gameData.score / currentRebirthCost) * 100);
            document.getElementById('rebirth-progress-bar').style.width = percent + "%";
            document.getElementById('rebirth-progress-text').innerText = `${formatNumber(gameData.score)} / ${formatNumber(currentRebirthCost)}`;
            document.getElementById('do-rebirth-btn').style.display = gameData.score >= currentRebirthCost ? 'inline-block' : 'none';
        }

        function executeRebirth() {
            gameData.score = 0; gameData.autoClick = 0; gameData.rebirths++;
            gameData.rebirthMultiplier *= 4; currentRebirthCost *= 10;
            upgrades.forEach(u => { u.count = 0; u.currentCost = u.baseCost; });
            initShop(); closeRebirthModal(); updateUI();
        }

        function spawnFloatingText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = text;
            el.style.left = x + (Math.random()*40-20) + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        setInterval(() => {
            if (gameData.autoClick > 0) {
                gameData.score += (gameData.autoClick * gameData.rebirthMultiplier) / 10;
                updateUI();
            }
        }, 100);

        initShop();
        updateUI();
        updateTVFocus();
    </script>
</body>
</html>
