<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <style>
        /* Adicione/Substitua isso no seu CSS para o botão de X aparecer corretamente */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            color: #e94560; /* Cor de destaque */
            transition: transform 0.2s, color 0.2s;
            line-height: 1;
            z-index: 210;
        }

        .close-btn:hover {
            color: #ffffff;
            transform: scale(1.2);
        }

        /* Garante que o modal use Flex para centralizar quando visível */
        #rebirth-modal {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <script>
        // 1. Função para abrir o painel (Visibilidade)
        function openRebirthModal() {
            const modal = document.getElementById('rebirth-modal');
            modal.style.display = 'flex';
            // Chama a função de atualizar a barra se ela existir no seu script principal
            if (typeof updateRebirthUI === "function") updateRebirthUI();
        }

        // 2. Função para fechar o painel (Invisibilidade)
        function closeRebirthModal() {
            const modal = document.getElementById('rebirth-modal');
            modal.style.display = 'none';
        }

        // 3. Fechar ao clicar fora da caixa central (Opcional, melhora a experiência)
        window.onclick = function(event) {
            const modal = document.getElementById('rebirth-modal');
            if (event.target == modal) {
                closeRebirthModal();
            }
        }
    </script>
</body>
</html>
