<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 1.18.32.02 Command Architect</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --chat-bg: #1e1e1e;
            --primary: #4caf50; /* Verde Minecraft */
            --primary-hover: #43a047;
            --text-main: #e0e0e0;
            --text-secondary: #a0a0a0;
            --user-msg-bg: #2c2c2c;
            --ai-msg-bg: #253326;
            --code-bg: #0d0d0d;
            --border: #333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            padding: 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        header h1 { font-size: 1.2rem; letter-spacing: 1px; color: var(--primary); }
        header p { font-size: 0.8rem; color: var(--text-secondary); }

        /* Chat Area */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* Mensagens */
        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 12px;
            line-height: 1.6;
            position: relative;
            animation: fadeIn 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
            border: 1px solid var(--border);
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
            border: 1px solid #2d442f;
        }

        /* Input Area */
        .input-area {
            background-color: var(--chat-bg);
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            padding: 12px;
            resize: none;
            height: 60px;
            min-height: 60px;
            max-height: 150px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus { border-color: var(--primary); }

        button#send-btn {
            width: 50px;
            height: 50px;
            background-color: var(--primary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, transform 0.1s;
        }

        button#send-btn:hover { background-color: var(--primary-hover); }
        button#send-btn:active { transform: scale(0.95); }
        
        button#send-btn svg { stroke: white; width: 24px; height: 24px; }

        /* Estilização Profissional do Conteúdo (Markdown) */
        .ai-message strong { color: #fff; font-weight: 600; }
        .ai-message ul { margin-left: 20px; margin-bottom: 10px; }
        .ai-message h3 { margin-top: 15px; margin-bottom: 10px; color: var(--primary); font-size: 1.1rem; }
        
        /* Bloco de Código e Botão Copiar */
        .code-container {
            margin: 15px 0;
            background-color: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: monospace;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .copy-btn:hover { background-color: #333; color: white; }
        .copy-btn svg { width: 14px; height: 14px; }

        pre {
            padding: 15px;
            overflow-x: auto;
            margin: 0;
        }

        code {
            font-family: 'Consolas', 'Monaco', monospace;
            color: #a5d6ff;
            font-size: 0.9rem;
        }

        /* Loaders */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 0;
        }
        .dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        .settings-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; cursor: pointer; }
        .settings-btn svg { stroke: var(--text-secondary); }
    </style>
</head>
<body>

<header>
    <div>
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="2" ry="2"></rect>
            <polyline points="8 6 16 12 8 18"></polyline>
        </svg>
    </div>
    <div>
        <h1>MCPE 1.18.32.02 Architect</h1>
        <p>Especialista em Comandos Bedrock</p>
    </div>
    <button class="settings-btn" onclick="clearMemory()" title="Limpar Memória">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
    </button>
</header>

<div id="chat-container">
    <div class="message ai-message">
        Olá! Sou sua especialista profissional em comandos para <strong>Minecraft Bedrock 1.18.32.02</strong>. <br><br>
        Posso criar sistemas complexos, explicar a lógica de Command Blocks e organizar tudo perfeitamente para você. Qual sistema vamos criar hoje?
    </div>
</div>

<div class="input-area">
    <textarea id="user-input" placeholder="Descreva o comando ou sistema que você deseja..." onkeydown="checkEnter(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
    </button>
</div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DA API
    // ==========================================
    
    // COLOQUE SUA API AQUI ABAIXO
    var API = "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";

    // ==========================================
    // PROMPTS DO SISTEMA
    // ==========================================

    const PROMPT_PROFESSIONAL = `
    Você é uma Engenheira de Comandos Sênior especializada EXCLUSIVAMENTE em Minecraft Bedrock Edition, versão 1.18.32.02.
    
    SUA PERSONALIDADE:
    - Profissional, técnica, direta e extremamente organizada.
    - Você não usa emojis. Você usa formatação limpa.
    - Você nunca erra a sintaxe da versão 1.18.32.
    
    SEUS DEVERES:
    1. Criar comandos livres de erros de sintaxe para a API Bedrock.
    2. Explicar EXATAMENTE onde cada comando vai:
       - Se é no Chat.
       - Se é no Command Block (Impulso, Cadeia, Repetição).
       - Condições (Incondicional/Condicional).
       - Redstone (Precisa de Redstone/Sempre Ativo).
    3. Se houver múltiplos comandos, explique a posição física (ex: "Coloque um bloco de repetição apontando para cima, e em cima dele um bloco em cadeia...").
    4. Explique a lógica de forma educacional.
    5. Use Markdown para blocos de código.
    `;

    const PROMPT_LEARNING = `
    INSTRUÇÕES DE ADAPTABILIDADE:
    - Se o usuário fornecer um método ou sintaxe específica que ele prefere, adote esse estilo imediatamente para as próximas respostas.
    - Integre o conhecimento que o usuário passar com sua base de dados profissional.
    - Se o usuário corrigir um comando, peça desculpas profissionalmente e gere a versão corrigida e otimizada.
    `;

    // ==========================================
    // LÓGICA DO SISTEMA
    // ==========================================

    let messageHistory = [];
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');

    window.onload = function() {
        loadChat();
    };

    function checkEnter(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        if (API === "API_aqui" || API === "") {
            alert("ERRO: Você precisa abrir o arquivo .html e colocar sua chave API do Groq na variável API.");
            return;
        }

        addMessageToUI(text, 'user');
        userInput.value = '';

        const typingId = addTypingIndicator();

        let apiMessages = [];
        apiMessages.push({ role: "system", content: PROMPT_PROFESSIONAL + "\n" + PROMPT_LEARNING });

        messageHistory.forEach(msg => {
            apiMessages.push(msg);
        });

        const newMessageObj = { role: "user", content: text };
        apiMessages.push(newMessageObj);
        
        messageHistory.push(newMessageObj);
        saveChat();

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${API}`
                },
                body: JSON.stringify({
                    messages: apiMessages,
                    model: "llama-3.3-70b-versatile", // Modelo original e estável do Groq
                    temperature: 0.5,
                    max_tokens: 2048
                })
            });

            const data = await response.json();
            
            document.getElementById(typingId).remove();

            if (data.choices && data.choices[0]) {
                const aiResponse = data.choices[0].message.content;
                addMessageToUI(aiResponse, 'ai');
                
                messageHistory.push({ role: "assistant", content: aiResponse });
                saveChat();
            } else {
                addMessageToUI("Erro: Resposta inválida da API. Verifique se sua chave API está correta e se possui créditos/limite.", 'ai');
            }

        } catch (error) {
            if(document.getElementById(typingId)) document.getElementById(typingId).remove();
            addMessageToUI("Erro de conexão: Verifique sua internet ou a validade da API Key. Detalhes: " + error.message, 'ai');
        }
    }

    function addMessageToUI(content, sender) {
        const div = document.createElement('div');
        div.classList.add('message');
        div.classList.add(sender === 'user' ? 'user-message' : 'ai-message');

        if (sender === 'ai') {
            div.innerHTML = marked.parse(content);
            processCodeBlocks(div);
        } else {
            div.textContent = content;
        }

        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function processCodeBlocks(element) {
        const pres = element.querySelectorAll('pre');
        pres.forEach(pre => {
            const codeContent = pre.innerText; 
            
            const wrapper = document.createElement('div');
            wrapper.className = 'code-container';
            
            const header = document.createElement('div');
            header.className = 'code-header';
            header.innerHTML = `<span>Minecraft 1.18.32</span>`;
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copiar
            `;
            
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(codeContent).then(() => {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = `<span>Copiado!</span>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                    }, 2000);
                });
            };

            header.appendChild(copyBtn);
            wrapper.appendChild(header);
            
            const newPre = pre.cloneNode(true);
            wrapper.appendChild(newPre);
            
            pre.parentNode.replaceChild(wrapper, pre);
        });
    }

    function addTypingIndicator() {
        const id = 'typing-' + Date.now();
        const div = document.createElement('div');
        div.id = id;
        div.classList.add('message', 'ai-message');
        div.style.width = "fit-content";
        div.innerHTML = `
            <div class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return id;
    }

    function saveChat() {
        localStorage.setItem('mcpe_ai_history', JSON.stringify(messageHistory));
    }

    function loadChat() {
        const saved = localStorage.getItem('mcpe_ai_history');
        if (saved) {
            messageHistory = JSON.parse(saved);
            messageHistory.forEach(msg => {
                if(msg.role !== 'system') {
                    addMessageToUI(msg.content, msg.role === 'assistant' ? 'ai' : 'user');
                }
            });
        }
    }

    function clearMemory() {
        if(confirm("Deseja apagar todo o histórico de conversa?")) {
            localStorage.removeItem('mcpe_ai_history');
            messageHistory = [];
            chatContainer.innerHTML = `
                <div class="message ai-message">
                    Memória apagada. Vamos começar um novo projeto do zero!
                </div>
            `;
        }
    }
</script>

</body>
</html>
