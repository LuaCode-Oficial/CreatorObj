<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathMaster AI - Aprendizado Visual</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --primary: #4f46e5;
            --secondary: #818cf8;
            --text: #1e293b;
            --accent: #10b981;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 2rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary);
            margin: 0;
        }

        p.subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        /* Grid de Seleção */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1.5rem;
            max-width: 1000px;
            width: 90%;
            margin-bottom: 2rem;
            transition: opacity 0.5s ease;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            border-color: var(--secondary);
        }

        .icon {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
        }

        .card h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text);
        }

        /* Área de Aprendizado */
        #learning-area {
            display: none;
            width: 95%;
            max-width: 1200px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 20px;
            margin-bottom: 2rem;
            flex-direction: column;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .back-btn {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
        }

        .back-btn:hover {
            background: #f1f5f9;
            color: var(--text);
        }

        .content-split {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .board-container {
            flex: 2;
            min-width: 300px;
            background: #1e1e1e;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }

        canvas {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        .interaction-area {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-window {
            flex-grow: 1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            overflow-y: auto;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .bot-msg {
            background: white;
            border: 1px solid #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-msg {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button.send-btn:hover {
            background: #4338ca;
        }

        button.send-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30,30,30,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2rem;
            z-index: 10;
            display: none;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <h1>MathMaster AI</h1>
        <p class="subtitle">Escolha o que deseja dominar hoje. A IA irá desenhar e explicar para você.</p>
    </header>

    <div class="grid-container" id="menu-grid">
        <div class="card" onclick="startLesson('soma', 'Adição ➕')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#e0e7ff" />
                <path d="M50 25 V75 M25 50 H75" stroke="#4f46e5" stroke-width="8" stroke-linecap="round" />
            </svg>
            <h3>Somar</h3>
        </div>
        <div class="card" onclick="startLesson('subtracao', 'Subtração ➖')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#fee2e2" />
                <path d="M25 50 H75" stroke="#ef4444" stroke-width="8" stroke-linecap="round" />
            </svg>
            <h3>Subtrair</h3>
        </div>
        <div class="card" onclick="startLesson('multiplicacao', 'Multiplicação ✖')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#ffedd5" />
                <path d="M30 30 L70 70 M70 30 L30 70" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
            </svg>
            <h3>Multiplicar</h3>
        </div>
        <div class="card" onclick="startLesson('divisao', 'Divisão ➗')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#dbeafe" />
                <circle cx="50" cy="30" r="6" fill="#2563eb" />
                <path d="M25 50 H75" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
                <circle cx="50" cy="70" r="6" fill="#2563eb" />
            </svg>
            <h3>Dividir</h3>
        </div>
        <div class="card" onclick="startLesson('potencia', 'Potência 🔢')">
            <svg class="icon" viewBox="0 0 100 100">
                <rect x="20" y="20" width="60" height="60" rx="10" fill="#f3e8ff" />
                <text x="35" y="65" font-family="Arial" font-weight="bold" font-size="40" fill="#9333ea">x</text>
                <text x="60" y="45" font-family="Arial" font-weight="bold" font-size="20" fill="#9333ea">2</text>
            </svg>
            <h3>Potência</h3>
        </div>
        <div class="card" onclick="startLesson('raiz', 'Raiz Quadrada √')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#d1fae5" />
                <path d="M20 55 L35 70 L45 30 H80" stroke="#059669" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <h3>Raiz</h3>
        </div>
        <div class="card" onclick="startLesson('porcentagem', 'Porcentagem %')">
            <svg class="icon" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#fce7f3" />
                <text x="25" y="65" font-family="Arial" font-weight="bold" font-size="45" fill="#db2777">%</text>
            </svg>
            <h3>Porcentagem</h3>
        </div>
    </div>

    <div id="learning-area">
        <div class="top-bar">
            <h2 id="lesson-title" style="margin:0; color:var(--primary);">Tópico</h2>
            <button class="back-btn" onclick="closeLesson()">← Voltar ao Menu</button>
        </div>

        <div class="content-split">
            <div class="board-container">
                <div class="loading-overlay" id="loader">
                    <div class="spinner"></div> Processando cálculo visual...
                </div>
                <canvas id="mathCanvas" width="800" height="600"></canvas>
            </div>

            <div class="interaction-area">
                <div class="chat-window" id="chat-box">
                    <div class="message bot-msg">Olá! Eu sou sua IA professora de matemática. O que você gostaria de saber sobre <span id="topic-name"></span>?</div>
                </div>
                <div class="input-area">
                    <input type="text" id="user-input" placeholder="Faça uma pergunta sobre a explicação..." onkeypress="handleEnter(event)">
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURAÇÃO
        // ==========================================
        const API_KEY = "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"; // INSIRA SUA API KEY AQUI
        
        let currentTopic = "";
        let conversationHistory = [];
        
       
        const menuGrid = document.getElementById('menu-grid');
        const learningArea = document.getElementById('learning-area');
        const lessonTitle = document.getElementById('lesson-title');
        const topicNameSpan = document.getElementById('topic-name');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const loader = document.getElementById('loader');
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');

        function startLesson(topicId, topicNiceName) {
            if(API_KEY === "coloque a api aqui" || API_KEY === "") {
                alert("Por favor, edite o arquivo HTML e insira sua chave da API Groq na variável API_KEY.");
                return;
            }

            currentTopic = topicNiceName;
            menuGrid.style.display = 'none';
            learningArea.style.display = 'flex';
            lessonTitle.innerText = topicNiceName;
            topicNameSpan.innerText = topicNiceName;
            
            chatBox.innerHTML = `<div class="message bot-msg">Olá! Vamos aprender <b>${topicNiceName}</b>. Vou gerar um exemplo prático e desenhar para você. Aguarde um momento...</div>`;
            conversationHistory = [];
            clearCanvas();

            triggerAI(`Gere um exemplo prático de ${topicNiceName} para iniciantes. Explique passo a passo e forneça os comandos de desenho JSON para eu visualizar no quadro.`);
        }

        function closeLesson() {
            learningArea.style.display = 'none';
            menuGrid.style.display = 'grid';
            clearCanvas();
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessageToChat(text, 'user');
            userInput.value = '';
            await triggerAI(text);
        }

        async function triggerAI(promptText) {
            showLoader(true);
            document.getElementById('send-btn').disabled = true;

            const systemPrompt = `
            Você é uma IA Professora de Matemática Visual Profissional e Lúdica. 
            Você DEVE responder SEMPRE em formato JSON estrito.
            
            Sua tarefa:
            1. Ensinar operações matemáticas (${currentTopic}).
            2. Revisar cálculos 3 vezes. 100% de precisão é obrigatório.
            3. No "draw_commands", você pode usar Emojis (como 🍎, 🍊, ⭐) para ilustrar quantidades, especialmente em Divisão e Soma.
            4. Se usar objetos (ex: 4 maçãs), desenhe-os primeiro, depois use setas para mostrar a operação.
            
            DIRETRIZES DE PRECISÃO VISUAL:
            - O Canvas tem 800x600. 
            - Nunca coloque textos ou círculos uns sobre os outros.
            - "arrow": x1/y1 é a origem, x2/y2 é a ponta. Aponte EXATAMENTE para o centro do objeto ou número que está explicando.
            - "circle": Deve envolver o número ou grupo de objetos com precisão.
            - Se for dividir 4 por 2, desenhe 4 maçãs (🍎) em uma linha e use "line" ou "arrow" para separá-las em dois grupos de 2.
            
            Estrutura do JSON:
            {
                "explanation": "Explicação pedagógica profissional em HTML.",
                "draw_commands": [
                    { "type": "clear" }, 
                    { "type": "text", "content": "🍎🍎", "x": 400, "y": 200, "size": 50 },
                    { "type": "arrow", "x1": 200, "y1": 200, "x2": 380, "y2": 200, "color": "#00FF00", "label": "Dividindo..." }
                ]
            }

            Pergunta: ${promptText}
            `;

            const messages = [
                { role: "system", content: systemPrompt },
                ...conversationHistory,
                { role: "user", content: promptText }
            ];

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: messages,
                        temperature: 0.1,
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiResponseContent = data.choices[0].message.content;
                let parsedResponse = JSON.parse(aiResponseContent);

                conversationHistory.push({ role: "user", content: promptText });
                conversationHistory.push({ role: "assistant", content: aiResponseContent });

                addMessageToChat(parsedResponse.explanation, 'bot');
                if (parsedResponse.draw_commands) processDrawCommands(parsedResponse.draw_commands);

            } catch (error) {
                addMessageToChat(`Erro: ${error.message}`, 'bot');
            } finally {
                showLoader(false);
                document.getElementById('send-btn').disabled = false;
            }
        }

        function addMessageToChat(html, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender === 'user' ? 'user-msg' : 'bot-msg'}`;
            div.innerHTML = html;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showLoader(show) {
            loader.style.display = show ? 'flex' : 'none';
        }

        function clearCanvas() {
            ctx.fillStyle = "#1e1e1e"; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#333";
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let x=0; x<=800; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,600); }
            for(let y=0; y<=600; y+=40) { ctx.moveTo(0,y); ctx.lineTo(800,y); }
            ctx.stroke();
        }

        function processDrawCommands(commands) {
            const hasClear = commands.find(c => c.type === 'clear');
            if(hasClear || conversationHistory.length < 3) clearCanvas();

            commands.forEach(cmd => {
                ctx.save();
                switch (cmd.type) {
                    case 'text':
                        ctx.font = `${cmd.size || 30}px 'Segoe UI Emoji', 'Courier New', monospace`;
                        ctx.fillStyle = cmd.color || '#fff';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(cmd.content, cmd.x, cmd.y);
                        break;
                    case 'line':
                        ctx.beginPath(); ctx.moveTo(cmd.x1, cmd.y1); ctx.lineTo(cmd.x2, cmd.y2);
                        ctx.strokeStyle = cmd.color || '#fff'; ctx.lineWidth = cmd.width || 2; ctx.stroke();
                        break;
                    case 'circle':
                        ctx.beginPath(); ctx.arc(cmd.x, cmd.y, cmd.radius, 0, 2 * Math.PI);
                        ctx.strokeStyle = cmd.color || '#ffff00'; ctx.lineWidth = cmd.width || 2; ctx.stroke();
                        break;
                    case 'arrow':
                        drawArrow(ctx, cmd.x1, cmd.y1, cmd.x2, cmd.y2, cmd.color, cmd.label);
                        break;
                }
                ctx.restore();
            });
        }

        function drawArrow(context, fromx, fromy, tox, toy, color, label) {
            const headlen = 15;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);
            context.strokeStyle = color || '#00ff00';
            context.fillStyle = color || '#00ff00';
            context.lineWidth = 3;
            context.beginPath(); context.moveTo(fromx, fromy); context.lineTo(tox, toy); context.stroke();
            context.beginPath(); context.moveTo(tox, toy);
            context.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            context.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            context.fill();
            if(label) { 
                context.font = "bold 16px Arial"; 
                context.fillStyle = "#fff"; 
                context.textAlign = "center";
                context.fillText(label, (fromx + tox)/2, (fromy + toy)/2 - 15); 
            }
        }

        window.onload = clearCanvas;
    </script>
</body>
</html>
