<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador de Missões</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap');

        :root {
            --primary: #ff00cc;
            --secondary: #333399;
            --bg-grad: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            color: #333;
        }

        .container {
            background: var(--glass);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        h1 { color: var(--secondary); margin-bottom: 10px; }
        p { color: #666; font-size: 0.9rem; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-family: inherit;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); outline: none; }

        .btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            width: 100%;
        }

        .btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .btn-small { width: auto; background: #4CAF50; margin: 5px; font-size: 0.8rem; padding: 8px 15px;}
        .btn-remove { background: #ff4444; }

        #setup-area, #result-area { display: none; }
        .link-item { display: flex; gap: 5px; animation: fadeIn 0.3s; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="welcome-area">
            <h1>Seja Bem-vindo! ✨</h1>
            <p>Crie missões personalizadas com links desbloqueáveis.</p>
            <button class="btn" onclick="startCreation()">Criar Missão</button>
        </div>

        <div id="setup-area">
            <h3>Configurar Destino Final</h3>
            <input type="text" id="finalText" placeholder="Texto do botão final (ex: Baixar Arquivo)">
            <input type="url" id="finalUrl" placeholder="Link final (ex: google drive, mega...)">
            
            <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
            
            <h3>Links da Missão (Máx: 5)</h3>
            <div id="links-container"></div>
            
            <div style="display: flex; justify-content: center;">
                <button class="btn btn-small" onclick="addLinkInput()">+ Adicionar Link</button>
                <button class="btn btn-small btn-remove" onclick="removeLinkInput()">- Remover</button>
            </div>

            <button class="btn" style="margin-top: 20px;" onclick="generateSite()">Gerar Site da Missão</button>
        </div>

        <div id="result-area">
            <h3>Pronto! 🎉</h3>
            <p>Copie o link abaixo e mande para as pessoas:</p>
            <input type="text" id="generatedLink" readonly>
            <button class="btn" onclick="copyLink()">Copiar Link</button>
            <button class="btn" style="background: #666; margin-top: 10px;" onclick="location.reload()">Criar Novo</button>
        </div>
    </div>

    <script>
        let linkCount = 0;

        function startCreation() {
            document.getElementById('welcome-area').style.display = 'none';
            document.getElementById('setup-area').style.display = 'block';
            addLinkInput(); // Adiciona o primeiro automaticamente
        }

        function addLinkInput() {
            if (linkCount >= 5) return alert("Máximo de 5 links!");
            linkCount++;
            
            const div = document.createElement('div');
            div.className = 'link-item';
            div.innerHTML = `<input type="url" class="mission-link" placeholder="Link da Missão ${linkCount} (ex: Instagram, YT)">`;
            document.getElementById('links-container').appendChild(div);
        }

        function removeLinkInput() {
            if (linkCount <= 1) return alert("Você precisa de pelo menos 1 link!");
            const container = document.getElementById('links-container');
            container.removeChild(container.lastChild);
            linkCount--;
        }

        function generateSite() {
            const finalTxt = document.getElementById('finalText').value;
            const finalUrl = document.getElementById('finalUrl').value;
            
            if(!finalTxt || !finalUrl) return alert("Preencha os dados do botão final!");

            // Coletar todos os links de missão
            const inputs = document.querySelectorAll('.mission-link');
            let links = [];
            let valid = true;
            inputs.forEach(input => {
                if(!input.value) valid = false;
                links.push(input.value);
            });

            if(!valid) return alert("Preencha todos os links de missão!");

            // Criar objeto de dados
            const data = {
                ft: finalTxt,
                fu: finalUrl,
                ls: links
            };

            // Converter para Base64 para colocar na URL
            const jsonString = JSON.stringify(data);
            const encodedData = btoa(jsonString); // Base64 encode

            // IMPORTANTE: Aqui assumimos que os arquivos estão na mesma pasta
            const currentPath = window.location.href;
            const basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const finalLink = `${basePath}/missao.html?d=${encodedData}`;

            document.getElementById('setup-area').style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
            document.getElementById('generatedLink').value = finalLink;
        }

        function copyLink() {
            const copyText = document.getElementById("generatedLink");
            copyText.select();
            document.execCommand("copy");
            alert("Link copiado!");
        }
    </script>
</body>
              </html>
