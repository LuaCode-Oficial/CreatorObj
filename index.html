<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Pro Connect</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0b141a;
            --panel-bg: #111b21;
            --chat-bg: #0b141a;
            --primary: #00a884;
            --text-main: #e9edef;
            --text-dim: #8696a0;
            --sent-msg: #005c4b;
            --received-msg: #202c33;
            --danger: #ff4b5c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        .screen { position: fixed; inset: 0; display: none; flex-direction: column; z-index: 10; background: var(--bg-dark); }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }

        /* LOGIN */
        #login-screen { align-items: center; justify-content: center; }
        .profile-upload { width: 150px; height: 150px; border-radius: 50%; background: #202c33; margin-bottom: 20px; cursor: pointer; overflow: hidden; border: 3px solid var(--primary); }
        #preview-img { width: 100%; height: 100%; object-fit: cover; }
        .input-group { width: 300px; display: flex; flex-direction: column; gap: 15px; }
        input[type="text"] { background: #2a3942; border: none; padding: 15px; border-radius: 8px; color: white; outline: none; border: 1px solid transparent; }
        input[type="text"]:focus { border-color: var(--primary); }
        .btn-entrar { background: var(--primary); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-entrar:hover { opacity: 0.8; }

        /* APP */
        #main-app { flex-direction: row; }
        .sidebar { width: 350px; border-right: 1px solid rgba(255,255,255,0.1); background: var(--panel-bg); display: flex; flex-direction: column; }
        .header { background: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .user-thumb { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; }

        .contacts-list { flex: 1; overflow-y: auto; }
        .contact-item { display: flex; align-items: center; padding: 15px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
        .contact-item:hover { background: #2a3942; }
        .contact-info { margin-left: 15px; flex: 1; }
        .typing-text { color: var(--primary); font-size: 0.8rem; display: none; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-color: rgba(11,20,26,0.9); background-blend-mode: darken; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        
        .message { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; position: relative; }
        .sent { align-self: flex-end; background: var(--sent-msg); }
        .received { align-self: flex-start; background: var(--received-msg); }

        .attachment-preview { background: #1e293b; padding: 10px; display: none; border-top: 2px solid var(--primary); }
        .input-bar { background: #202c33; padding: 10px; display: flex; align-items: center; gap: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <section id="login-screen" class="screen active">
        <div class="profile-upload" onclick="document.getElementById('file-input').click()">
            <img id="preview-img" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <input type="file" id="file-input" hidden accept="image/*" onchange="previewImage(this)">
        </div>
        <div class="input-group">
            <input type="text" id="user-name" placeholder="Digite seu nome">
            <button class="btn-entrar" onclick="cadastrarUsuario()">ENTRAR</button>
        </div>
    </section>

    <section id="main-app" class="screen">
        <div class="sidebar">
            <div class="header">
                <img id="my-avatar" class="user-thumb">
                <span id="my-number" style="font-weight: bold; color: var(--primary);"></span>
                <button onclick="adicionarContato()" style="background:none; border:none; color:var(--primary); font-size:24px; cursor:pointer;">+</button>
            </div>
            <div class="contacts-list" id="contacts-container"></div>
        </div>

        <div class="chat-area" id="chat-view" style="visibility: hidden;">
            <div class="header">
                <div style="display:flex; align-items:center;">
                    <span onclick="fecharChat()" style="margin-right:15px; cursor:pointer;">✕</span>
                    <img id="chat-target-img" class="user-thumb">
                    <div style="margin-left:15px;">
                        <div id="chat-target-name" style="font-weight:bold;"></div>
                        <small id="typing-anim" class="typing-text">digitando...</small>
                    </div>
                </div>
            </div>
            
            <div class="chat-messages" id="messages-container"></div>

            <div id="attachment-area" class="attachment-preview">
                <small id="file-label"></small>
                <button onclick="cancelarAnexo()" style="color:var(--danger); background:none; border:none; margin-left:10px; cursor:pointer;">Remover</button>
            </div>

            <div class="input-bar">
                <button onclick="document.getElementById('file-msg').click()" style="background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer;">+</button>
                <input type="file" id="file-msg" hidden onchange="prepararArquivo(this)">
                <input type="text" id="msg-input" placeholder="Mensagem" style="flex:1; background:#2a3942; border:none; padding:12px; border-radius:8px; color:white;">
                <button onclick="enviarMensagem()" class="btn-entrar" style="padding:10px 20px;">Enviar</button>
            </div>
        </div>
    </section>

    <script>
        const SUPABASE_URL = 'https://mgrvyboskvvlcvqclufh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_HsVRJqKhYoCCVTnPTvgp9w_okpI3WE0';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let userSession = JSON.parse(localStorage.getItem('chat_session')) || null;
        let activeChat = null;
        let fileBase64 = null;

        // INICIALIZAÇÃO
        window.onload = () => {
            if (userSession) {
                logar(userSession);
            }
        };

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('preview-img').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function cadastrarUsuario() {
            const name = document.getElementById('user-name').value;
            const photo = document.getElementById('preview-img').src;
            if (!name) return alert("Digite um nome");

            const newUser = {
                name: name,
                photo: photo,
                number: Math.floor(100000 + Math.random() * 900000).toString(),
                contacts: []
            };

            localStorage.setItem('chat_session', JSON.stringify(newUser));
            logar(newUser);
        }

        function logar(session) {
            userSession = session;
            document.getElementById('login-screen').classList.remove('active');
            document.getElementById('main-app').classList.add('active');
            document.getElementById('my-avatar').src = session.photo;
            document.getElementById('my-number').innerText = "#" + session.number;
            renderizarContatos();
            ouvirMensagens();
        }

        // CONTATOS
        function adicionarContato() {
            const num = prompt("Número do contato:");
            if (!num) return;
            
            const novoContato = { 
                name: "Contato " + num, 
                number: num, 
                photo: "https://i.pravatar.cc/150?u=" + num 
            };
            
            userSession.contacts.push(novoContato);
            localStorage.setItem('chat_session', JSON.stringify(userSession));
            renderizarContatos();
        }

        function renderizarContatos() {
            const container = document.getElementById('contacts-container');
            container.innerHTML = "";
            userSession.contacts.forEach(c => {
                const div = document.createElement('div');
                div.className = 'contact-item';
                div.onclick = () => abrirChat(c);
                div.innerHTML = `
                    <img src="${c.photo}" class="user-thumb">
                    <div class="contact-info">
                        <strong>${c.name}</strong><br>
                        <small>#${c.number}</small>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // CHAT
        function abrirChat(contato) {
            activeChat = contato;
            document.getElementById('chat-view').style.visibility = 'visible';
            document.getElementById('chat-target-name').innerText = contato.name;
            document.getElementById('chat-target-img').src = contato.photo;
            document.getElementById('messages-container').innerHTML = "";
            carregarHistorico();
        }

        function fecharChat() {
            document.getElementById('chat-view').style.visibility = 'hidden';
            activeChat = null;
        }

        function prepararArquivo(input) {
            if (input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    fileBase64 = e.target.result;
                    document.getElementById('attachment-area').style.display = 'block';
                    document.getElementById('file-label').innerText = "Arquivo selecionado: " + input.files[0].name;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function cancelarAnexo() {
            fileBase64 = null;
            document.getElementById('attachment-area').style.display = 'none';
        }

        // SALVAMENTO NO SUPABASE (SISTEMA DE MENSAGENS)
        async function enviarMensagem() {
            const input = document.getElementById('msg-input');
            if (!input.value && !fileBase64) return;

            const payload = {
                de: userSession.number,
                para: activeChat.number,
                texto: input.value,
                midia: fileBase64,
                hora: Date.now()
            };

            const formatado = `${userSession.name}|${JSON.stringify(payload)}`;

            const { error } = await supabaseClient
                .from('mensagens')
                .insert([{ conteudo: formatado }]);

            if (!error) {
                renderMsg(payload, 'sent');
                input.value = "";
                cancelarAnexo();
            }
        }

        function renderMsg(data, tipo) {
            const container = document.getElementById('messages-container');
            const div = document.createElement('div');
            div.className = `message ${tipo}`;
            
            let html = "";
            if (data.midia) html += `<img src="${data.midia}" style="max-width:100%; border-radius:5px;"><br>`;
            if (data.texto) html += `<span>${data.texto}</span>`;
            
            div.innerHTML = html;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function carregarHistorico() {
            const { data } = await supabaseClient.from('mensagens').select('*');
            if (data) {
                data.forEach(item => {
                    try {
                        const msg = JSON.parse(item.conteudo.split('|')[1]);
                        if ((msg.de === userSession.number && msg.para === activeChat.number) ||
                            (msg.de === activeChat.number && msg.para === userSession.number)) {
                            renderMsg(msg, msg.de === userSession.number ? 'sent' : 'received');
                        }
                    } catch (e) {}
                });
            }
        }

        function ouvirMensagens() {
            supabaseClient
                .channel('chat-geral')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'mensagens' }, payload => {
                    const [nome, json] = payload.new.conteudo.split('|');
                    const msg = JSON.parse(json);
                    
                    if (msg.para === userSession.number && activeChat && msg.de === activeChat.number) {
                        renderMsg(msg, 'received');
                    }
                }).subscribe();
        }
    </script>
</body>
</html>
